map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Mitigación del Bug QA #32: el JWT del WebSocket viaja en ?token= y el
# access_log por defecto registra la query completa ($request). Mientras el
# backend no emita un ticket de un solo uso para el WS, se usa $uri (sin
# query string) en vez de $request para todo el server, no solo para /api/.
log_format sin_query_string
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log sin_query_string;

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
