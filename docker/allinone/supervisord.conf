[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=%(ENV_PG_BIN)s/postgres -D /data/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=/usr/local/bin/minio server /data/minio --address 127.0.0.1:9000 --console-address :9001
environment=MINIO_ROOT_USER="%(ENV_MINIO_ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_MINIO_SECRET_KEY)s"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
; Espera a MinIO (el arranque crea el bucket); el entrypoint del backend espera
; a PostgreSQL, crea la BD con el schema maestro si está vacía y el admin inicial.
command=sh -c 'until curl -fs http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 1; done; exec /app/docker/entrypoint.sh uvicorn app.main:app --host 127.0.0.1 --port 8000'
directory=/app
user=woowkids
environment=HOME="/home/woowkids",DATABASE_URL="postgresql://%(ENV_POSTGRES_USER)s:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/%(ENV_POSTGRES_DB)s"
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g 'daemon off;'
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
